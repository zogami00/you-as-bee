# you-as-bee: load the USB/IP host side and keep the consumer USB drivers off
# the devices we export.
#
# Blacklisting btusb and xone is safe on the Raspberry Pi 4B and Pi Zero 2 W:
# onboard Bluetooth is wired to the SoC over the UART and driven by hci_uart,
# NOT by btusb over USB. So the onboard adapter keeps working, while any USB
# Bluetooth dongle or Xbox wireless dongle we want to export is left free for
# usbip-host to claim.

# usbip-host depends on usbip-core; load it first.
softdep usbip-host pre: usbip-core

# Keep btusb/xone from grabbing dongles we intend to export.
blacklist btusb
blacklist xone

# The Xbox Wireless Adapter (045e:02e6) contains a MediaTek chipset that the
# in-tree mt76x2u *Wi-Fi* driver claims on kernels without xone, which stops it
# from being exported. Blacklisting mt76x2u is safe on the Pi 4B and Zero 2 W
# because onboard Wi-Fi is SDIO (brcmfmac), not USB. If you use a USB MediaTek
# Wi-Fi adapter driven by mt76x2u on this Pi, this blacklist will disable it.
blacklist mt76x2u
