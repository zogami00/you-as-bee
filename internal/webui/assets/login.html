<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - you-as-bee</title>
  <link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body class="login">
  <main class="login-card">
    <h1>you-as-bee</h1>
    <p>Enter the agent token from <code>/etc/you-as-bee/token</code> on the Pi.</p>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <form method="post" action="/ui/login">
      <input type="hidden" name="code" value="{{.Code}}">
      <label for="token">Token</label>
      <input id="token" type="password" name="token" autocomplete="off" autofocus required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
