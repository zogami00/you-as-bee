<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>you-as-bee</title>
  <link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body data-yab-mode="{{.Mode}}" data-yab-api="{{.APIBase}}">
  <header class="topbar">
    <h1>you-as-bee</h1>
    <span id="connection" class="badge badge-unknown">connecting</span>
    <span class="spacer"></span>
    <button id="logout" type="button" class="danger">Log out</button>
  </header>

  <main>
    <section id="summary" class="panel">
      <h2>Agent</h2>
      <dl id="info"></dl>
    </section>

    <section class="panel">
      <h2>Devices</h2>
      <div id="devices" class="devices"></div>
    </section>

    <section class="panel">
      <h2>Logs</h2>
      <div id="logs" class="logs"></div>
    </section>
  </main>

  <script src="/ui/assets/app.js"></script>
</body>
</html>
